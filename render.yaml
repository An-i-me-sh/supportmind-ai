services:
  # SupportMind AI - Unified Enterprise Support Platform (FastAPI + React SPA)
  - type: web
    name: supportmind-ai
    env: python
    plan: free
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: supportmind-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: SIMILARITY_THRESHOLD
        value: "0.3"
      - key: JWT_SECRET
        generateValue: true
      - key: EMBEDDING_MODEL_NAME
        value: "BAAI/bge-small-en-v1.5"
      - key: UPLOAD_DIR
        value: "uploads"

databases:
  - name: supportmind-db
    plan: free
    postgresMajorVersion: "16"
